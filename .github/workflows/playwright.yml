# Verificacion de pantalla de admin.
#
# Corregido el 30-08-2026: antes disparaba en [main, master]. main es
# produccion, asi que el aviso de layout roto llegaba despues de publicarlo; y
# master no existe en ningun repo de la organizacion, asi que esa mitad del
# trigger nunca corrio.
name: Playwright Tests

on:
  push:
    branches: [ "dev", "staging" ]
  pull_request:
    branches: [ "dev", "staging" ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-admin
        path: |
          playwright-report/
          test-results/
        retention-days: 30
