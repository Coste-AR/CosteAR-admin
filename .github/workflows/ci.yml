name: Admin CI

on:
  push:
    branches: ["dev", "staging", "main"]
  pull_request:
    branches: ["dev", "staging", "main"]

# Este repo todavía no tiene ESLint instalado. El CI corre el test unitario del
# briefing, typecheck y build; la suite E2E vive en su workflow dedicado.
#
# Cuando se agregue ESLint, sumar el paso correspondiente y actualizar
# CLAUDE.md §2 (regla CMD-02).

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Un workflow con el YAML roto no rompe el CI: GitHub simplemente deja de
      # correrlo, y lo reporta como un "failure" colgado de un push cualquiera
      # con el mensaje generico "this run likely failed because of a workflow
      # file issue". Los PR se quedan en CLEAN para siempre esperando a nadie.
      #
      # Paso el 30-08-2026: ocho PR quedaron trabados y se descubrio de
      # casualidad. Y aca importa el doble: este repo no tiene proteccion de
      # rama, asi que el workflow de auto-merge es la unica verificacion que hay.
      - name: Los workflows tienen que ser YAML valido
        run: python3 scripts/chequear-workflows.py .github/workflows/*.yml

      - name: El auto-merge maneja los PR atrasados sin abrir la puerta
        run: python3 scripts/probar-auto-merge-atrasados.py .github/workflows/auto-merge.yml

      - name: G7 falla cerrado sin revelar identificadores
        run: python3 scripts/probar-g7.py

      - name: Tests unitarios
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
